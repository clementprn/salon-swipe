/* ════════════════════════════════════════════════════════════════
   LOCAL DATA LAYER — mirrors the shape of the original tRPC/DB API
   but runs entirely against localStorage. This is what makes the
   app fully standalone (no backend, no network calls for data).
   ════════════════════════════════════════════════════════════════ */

const LS = {
  seeded: "ss_seeded_v1",
  users: "ss_users",
  votes: "ss_votes",
  teams: "ss_teams",
  members: "ss_members",
  invites: "ss_invites",
  waitlist: "ss_waitlist",
  auth: "ss_auth",
};

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function writeJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function seedIfNeeded() {
  if (localStorage.getItem(LS.seeded)) return;

  const rand = mulberry32(20260101);
  const users = {};
  DEMO_TEAMMATES.forEach(u => { users[u.id] = u; });

  const votes = [];
  let voteId = 1;
  EXHIBITORS.forEach(ex => {
    DEMO_TEAMMATES.forEach(u => {
      if (rand() < 0.5) {
        let type = "like";
        const r2 = rand();
        if (ex.tier === "A" && r2 < 0.55) type = "superlike";
        else if (ex.tier === "D" && r2 < 0.35) type = "dislike";
        else if (r2 < 0.1) type = "dislike";
        else if (r2 < 0.28) type = "superlike";
        const daysAgo = Math.floor(rand() * 5) + 1;
        const iso = new Date(Date.now() - daysAgo * 86400000).toISOString();
        votes.push({
          id: voteId++, userId: u.id, exhibitorId: ex.id, eventId: ex.eventId,
          voteType: type, note: null, createdAt: iso, updatedAt: iso,
        });
      }
    });
  });

  const members = [
    { id: 1, teamId: 501, userId: 9001, eventId: 1 },
    { id: 2, teamId: 501, userId: 9002, eventId: 1 },
    { id: 3, teamId: 501, userId: 9003, eventId: 1 },
    { id: 4, teamId: 502, userId: 9001, eventId: 2 },
    { id: 5, teamId: 502, userId: 9002, eventId: 2 },
    { id: 6, teamId: 502, userId: 9003, eventId: 2 },
  ];

  writeJSON(LS.users, users);
  writeJSON(LS.votes, votes);
  writeJSON(LS.teams, DEMO_TEAMS);
  writeJSON(LS.members, members);
  writeJSON(LS.invites, []);
  writeJSON(LS.waitlist, []);
  localStorage.setItem(LS.seeded, "1");
}

const db = {
  getEvents: () => EVENTS,
  getEventBySlug: (slug) => EVENTS.find(e => e.slug === slug) || null,
  getExhibitorsByEvent: (eventId) => EXHIBITORS.filter(e => e.eventId === eventId),
  getExhibitorById: (id) => EXHIBITORS.find(e => e.id === id) || null,

  getUserName: (userId) => {
    const users = readJSON(LS.users, {});
    return users[userId]?.name ?? "Anonyme";
  },
  registerUser: (user) => {
    const users = readJSON(LS.users, {});
    users[user.id] = user;
    writeJSON(LS.users, users);
  },

  getSwipeQueue: (userId, eventId, batchSize) => {
    const all = db.getExhibitorsByEvent(eventId);
    const votes = readJSON(LS.votes, []);
    const votedIds = new Set(votes.filter(v => v.userId === userId).map(v => v.exhibitorId));
    const remaining = all.filter(e => !votedIds.has(e.id));
    return { queue: remaining.slice(0, batchSize ?? remaining.length), remaining: remaining.length };
  },

  castVote: (userId, exhibitorId, eventId, voteType) => {
    const votes = readJSON(LS.votes, []);
    const now = new Date().toISOString();
    const idx = votes.findIndex(v => v.userId === userId && v.exhibitorId === exhibitorId);
    if (idx >= 0) votes[idx] = { ...votes[idx], voteType, updatedAt: now };
    else {
      const nextId = (votes.reduce((m, v) => Math.max(m, v.id), 0) || 0) + 1;
      votes.push({ id: nextId, userId, exhibitorId, eventId, voteType, note: null, createdAt: now, updatedAt: now });
    }
    writeJSON(LS.votes, votes);
  },
  deleteVote: (userId, exhibitorId) => {
    const votes = readJSON(LS.votes, []);
    writeJSON(LS.votes, votes.filter(v => !(v.userId === userId && v.exhibitorId === exhibitorId)));
  },
  deleteAllVotes: (userId, eventId) => {
    const votes = readJSON(LS.votes, []);
    writeJSON(LS.votes, votes.filter(v => !(v.userId === userId && (!eventId || v.eventId === eventId))));
  },

  getMyVotes: (userId, eventId) => {
    const votes = readJSON(LS.votes, []).filter(v => v.userId === userId && (!eventId || v.eventId === eventId));
    return votes
      .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
      .map(v => ({ ...v, exhibitor: db.getExhibitorById(v.exhibitorId) }));
  },

  getTeamVotes: (eventId) => {
    const votes = readJSON(LS.votes, []).filter(v => !eventId || v.eventId === eventId);
    const users = readJSON(LS.users, {});
    return votes
      .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
      .map(v => ({
        ...v,
        exhibitor: db.getExhibitorById(v.exhibitorId),
        user: users[v.userId] ? { id: v.userId, name: users[v.userId].name } : { id: v.userId, name: "Anonyme" },
      }));
  },

  getVoteStats: (eventId) => {
    const votes = readJSON(LS.votes, []).filter(v => !eventId || v.eventId === eventId);
    const users = readJSON(LS.users, {});
    const total = votes.length;
    const likes = votes.filter(v => v.voteType === "like").length;
    const superlikes = votes.filter(v => v.voteType === "superlike").length;
    const dislikes = votes.filter(v => v.voteType === "dislike").length;

    const byTier = {};
    votes.forEach(v => {
      const ex = db.getExhibitorById(v.exhibitorId);
      if (!ex) return;
      byTier[ex.tier] = byTier[ex.tier] || {};
      byTier[ex.tier][v.voteType] = (byTier[ex.tier][v.voteType] || 0) + 1;
    });

    const byUserMap = {};
    votes.forEach(v => {
      if (!byUserMap[v.userId]) {
        byUserMap[v.userId] = { userId: v.userId, userName: users[v.userId]?.name ?? "Anonyme", total: 0, likes: 0, superlikes: 0, dislikes: 0 };
      }
      byUserMap[v.userId].total++;
      byUserMap[v.userId][v.voteType === "like" ? "likes" : v.voteType === "superlike" ? "superlikes" : "dislikes"]++;
    });

    return { total, likes, superlikes, dislikes, byTier, byUser: Object.values(byUserMap) };
  },

  exportCsv: (userId, eventId, scope) => {
    const data = scope === "team" ? db.getTeamVotes(eventId) : db.getMyVotes(userId, eventId);
    const header = "Exposant,Stand,Tier,Vote,Note,Votant,Date";
    const rows = data.map(v => [
      `"${(v.exhibitor?.name ?? "").replace(/"/g, '""')}"`,
      `"${(v.exhibitor?.stand ?? "").replace(/"/g, '""')}"`,
      v.exhibitor?.tier ?? "",
      v.voteType,
      `"${(v.note ?? "").replace(/"/g, '""')}"`,
      `"${(v.user?.name ?? "Moi").replace(/"/g, '""')}"`,
      new Date(v.createdAt).toLocaleDateString("fr-FR"),
    ].join(","));
    return { csv: [header, ...rows].join("\n"), count: data.length };
  },

  getTeams: (eventId) => readJSON(LS.teams, []).filter(t => t.eventId === eventId),
  getMyTeam: (userId, eventId) => {
    const members = readJSON(LS.members, []);
    const membership = members.find(m => m.userId === userId && m.eventId === eventId);
    if (!membership) return null;
    const team = readJSON(LS.teams, []).find(t => t.id === membership.teamId);
    if (!team) return null;
    const users = readJSON(LS.users, {});
    const teamMembers = members
      .filter(m => m.teamId === team.id && m.eventId === eventId)
      .map(m => ({ id: m.userId, name: users[m.userId]?.name ?? "Anonyme", email: users[m.userId]?.email ?? null }));
    return { ...team, members: teamMembers };
  },
  createTeam: (userId, name, eventId) => {
    const teams = readJSON(LS.teams, []);
    const id = (teams.reduce((m, t) => Math.max(m, t.id), 0) || 0) + 1;
    const team = { id, name, eventId, createdBy: userId };
    teams.push(team);
    writeJSON(LS.teams, teams);
    const members = readJSON(LS.members, []);
    const mid = (members.reduce((m, x) => Math.max(m, x.id), 0) || 0) + 1;
    members.push({ id: mid, teamId: id, userId, eventId });
    writeJSON(LS.members, members);
    return team;
  },
  joinTeam: (userId, teamId, eventId) => {
    const members = readJSON(LS.members, []);
    const idx = members.findIndex(m => m.userId === userId && m.eventId === eventId);
    if (idx >= 0) members[idx] = { ...members[idx], teamId };
    else {
      const mid = (members.reduce((m, x) => Math.max(m, x.id), 0) || 0) + 1;
      members.push({ id: mid, teamId, userId, eventId });
    }
    writeJSON(LS.members, members);
    return { success: true, teamId };
  },
  createInviteToken: (userId, teamId) => {
    const invites = readJSON(LS.invites, []);
    const token = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
    invites.push({ token, teamId, createdBy: userId, expiresAt: Date.now() + 7 * 86400000 });
    writeJSON(LS.invites, invites);
    return token;
  },
  resolveInviteToken: (userId, token) => {
    const invites = readJSON(LS.invites, []);
    const invite = invites.find(i => i.token === token);
    if (!invite) throw new Error("Lien d'invitation invalide");
    if (invite.expiresAt < Date.now()) throw new Error("Lien d'invitation expiré");
    const team = readJSON(LS.teams, []).find(t => t.id === invite.teamId);
    if (!team) throw new Error("Équipe introuvable");
    db.joinTeam(userId, invite.teamId, team.eventId);
    return { success: true, teamId: invite.teamId, teamName: team.name, eventId: team.eventId };
  },

  joinWaitlist: (email, name, company) => {
    const list = readJSON(LS.waitlist, []);
    if (list.some(w => w.email === email)) throw new Error("Cet email est déjà sur la liste d'attente.");
    list.push({ email, name, company, createdAt: new Date().toISOString() });
    writeJSON(LS.waitlist, list);
  },
};

/* ════════════════════════════════════════════════════════════════
   AI ASSISTANT — answers are computed live from local vote data
   instead of calling an LLM (this build has no backend to call).
   ════════════════════════════════════════════════════════════════ */

function parseStand(stand) {
  if (!stand) return { hall: "Z", num: 9999 };
  const match = stand.match(/([A-Z]+)\s*(\d+)/i);
  if (match) return { hall: match[1].toUpperCase(), num: parseInt(match[2], 10) };
  const numMatch = stand.match(/(\d+)/);
  if (numMatch) return { hall: "A", num: parseInt(numMatch[1], 10) };
  return { hall: (stand.charAt(0) || "Z").toUpperCase(), num: 0 };
}

function groupTeamVotes(eventId) {
  const teamVotes = db.getTeamVotes(eventId);
  const byExhibitor = {};
  teamVotes.forEach(v => {
    if (!v.exhibitor) return;
    if (!byExhibitor[v.exhibitorId]) byExhibitor[v.exhibitorId] = { exhibitor: v.exhibitor, votes: [] };
    byExhibitor[v.exhibitorId].votes.push(v);
  });
  return Object.values(byExhibitor).map(g => ({
    ...g,
    score: g.votes.reduce((s, v) => s + (v.voteType === "superlike" ? 3 : v.voteType === "like" ? 1 : -1), 0),
    superlikeCount: g.votes.filter(v => v.voteType === "superlike").length,
    likeCount: g.votes.filter(v => v.voteType === "like").length,
    dislikeCount: g.votes.filter(v => v.voteType === "dislike").length,
    voters: new Set(g.votes.map(v => v.userId)).size,
  })).sort((a, b) => b.score - a.score);
}

function fmtList(items) { return items.map((s, i) => `${i + 1}. ${s}`).join("\n"); }

const AI = {
  topExhibitors(eventId) {
    const grouped = groupTeamVotes(eventId);
    if (grouped.length === 0) return "Aucun vote enregistré pour l'instant sur ce salon. Swipez quelques exposants pour que je puisse analyser les tendances !";
    const top = grouped.slice(0, 5);
    return `Voici les exposants les mieux notés par l'équipe :\n\n` + fmtList(top.map(g =>
      `**${g.exhibitor.name}** (Stand ${g.exhibitor.stand ?? "N/A"}, tier ${g.exhibitor.tier}) — ${g.score}pts (${g.superlikeCount}⭐ / ${g.likeCount}✅ / ${g.dislikeCount}❌)`
    ));
  },
  trends(eventId) {
    const stats = db.getVoteStats(eventId);
    if (stats.total === 0) return "Pas encore assez de votes pour dégager une tendance. Commencez à swiper !";
    const posRate = Math.round(((stats.likes + stats.superlikes) / stats.total) * 100);
    const grouped = groupTeamVotes(eventId);
    const bestTier = Object.entries(stats.byTier).sort((a, b) => {
      const scoreA = (a[1].superlike || 0) * 3 + (a[1].like || 0);
      const scoreB = (b[1].superlike || 0) * 3 + (b[1].like || 0);
      return scoreB - scoreA;
    })[0];
    return `Sur ${stats.total} votes au total, ${posRate}% sont positifs (like ou super like).\n\n` +
      `Le tier **${bestTier ? bestTier[0] : "B"}** concentre le plus d'intérêt de l'équipe. ` +
      `L'exposant le plus plébiscité est **${grouped[0]?.exhibitor.name ?? "N/A"}**.`;
  },
  mySuperlikes(eventId, userId) {
    const mine = db.getMyVotes(userId, eventId).filter(v => v.voteType === "superlike" && v.exhibitor);
    if (mine.length === 0) return "Vous n'avez pas encore mis de super like sur ce salon. Repérez les exposants incontournables en swipant vers le haut !";
    return `Vos super likes sur ce salon :\n\n` + fmtList(mine.map(v => `**${v.exhibitor.name}** — Stand ${v.exhibitor.stand ?? "N/A"}`));
  },
  byTier(eventId) {
    const stats = db.getVoteStats(eventId);
    const tiers = ["A", "B", "C", "D"];
    if (stats.total === 0) return "Aucun vote pour l'instant : impossible de répartir par tier.";
    const lines = tiers.map(t => {
      const s = stats.byTier[t] || {};
      return `**Tier ${t}** — ${s.superlike || 0}⭐ super likes, ${s.like || 0}✅ likes, ${s.dislike || 0}❌ pas intéressé`;
    });
    return `Répartition des votes par tier :\n\n${lines.join("\n")}`;
  },
  consensus(eventId) {
    const grouped = groupTeamVotes(eventId).filter(g => g.voters >= 2);
    if (grouped.length === 0) return "Pas encore assez de recoupement entre votants pour dégager un consensus. Invitez votre équipe à voter !";
    const top = grouped.slice(0, 5);
    return `Exposants sur lesquels l'équipe est la plus unanime :\n\n` + fmtList(top.map(g =>
      `**${g.exhibitor.name}** — ${g.voters} votants, score ${g.score}pts`
    ));
  },
  recommendations(eventId, userId) {
    const grouped = groupTeamVotes(eventId);
    const myVotedIds = new Set(db.getMyVotes(userId, eventId).map(v => v.exhibitorId));
    const reco = grouped.filter(g => !myVotedIds.has(g.exhibitor.id) && g.score > 0).slice(0, 5);
    if (reco.length === 0) return "Vous avez déjà voté sur tous les exposants les mieux notés par l'équipe. Beau travail !";
    return `À prioriser lors de votre visite (bien notés par l'équipe, pas encore vus par vous) :\n\n` + fmtList(reco.map(g =>
      `**${g.exhibitor.name}** — Stand ${g.exhibitor.stand ?? "N/A"}, tier ${g.exhibitor.tier}`
    ));
  },
  stats(eventId) {
    const stats = db.getVoteStats(eventId);
    if (stats.total === 0) return "Aucun vote enregistré pour l'instant sur ce salon.";
    return `**Résumé statistique**\n\n- Total de votes : ${stats.total}\n- Likes : ${stats.likes}\n- Super likes : ${stats.superlikes}\n- Pas intéressé : ${stats.dislikes}\n- Votants actifs : ${stats.byUser.length}`;
  },
  sectors(eventId) {
    const grouped = groupTeamVotes(eventId);
    const bySector = {};
    grouped.forEach(g => {
      const sector = g.exhibitor.sector || "Autre";
      bySector[sector] = (bySector[sector] || 0) + g.score;
    });
    const sorted = Object.entries(bySector).sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (sorted.length === 0) return "Aucun vote pour l'instant : impossible d'analyser les secteurs.";
    return `Secteurs les plus plébiscités :\n\n` + fmtList(sorted.map(([sector, score]) => `**${sector}** — ${score}pts cumulés`));
  },
  fullReport(eventId, eventName) {
    const grouped = groupTeamVotes(eventId);
    const stats = db.getVoteStats(eventId);
    const date = new Date().toLocaleDateString("fr-FR");
    if (grouped.length === 0) return `# Rapport — ${eventName}\n\nAucun vote enregistré pour l'instant.`;
    const consensus = grouped.filter(g => g.voters >= 2).slice(0, 3);
    const reco = grouped.filter(g => g.score > 0).slice(0, 5);
    return [
      `# Rapport complet — ${eventName}`,
      ``,
      `*Généré le ${date} · ${stats.total} votes · ${stats.byUser.length} votants*`,
      ``,
      `## Classement général`,
      ``,
      `| Rang | Exposant | Stand | Tier | Score |`,
      `|------|----------|-------|------|-------|`,
      ...grouped.slice(0, 10).map((g, i) => `| ${i + 1} | **${g.exhibitor.name}** | ${g.exhibitor.stand ?? "N/A"} | ${g.exhibitor.tier} | ${g.score}pts |`),
      ``,
      `## Tendances`,
      ``,
      `- ${stats.likes} likes, ${stats.superlikes} super likes, ${stats.dislikes} pas intéressé`,
      `- Taux d'avis positif : ${stats.total > 0 ? Math.round(((stats.likes + stats.superlikes) / stats.total) * 100) : 0}%`,
      ``,
      `## Consensus d'équipe`,
      ``,
      ...(consensus.length > 0 ? consensus.map(g => `- **${g.exhibitor.name}** (${g.voters} votants, ${g.score}pts)`) : ["Pas encore de consensus fort."]),
      ``,
      `## Recommandations de visite`,
      ``,
      ...(reco.length > 0 ? reco.map((g, i) => `${i + 1}. **${g.exhibitor.name}** — Stand ${g.exhibitor.stand ?? "N/A"}`) : ["Pas encore assez de votes pour recommander un parcours."]),
    ].join("\n");
  },
  visitReport(eventId, eventName, userId) {
    const date = new Date().toLocaleDateString("fr-FR");
    let favorites = db.getMyVotes(userId, eventId).filter(v => (v.voteType === "like" || v.voteType === "superlike") && v.exhibitor).map(v => v.exhibitor);
    if (favorites.length === 0) {
      favorites = groupTeamVotes(eventId).filter(g => g.score > 0).slice(0, 8).map(g => g.exhibitor);
    }
    if (favorites.length === 0) return `# Rapport de visite — ${eventName}\n\nAucun favori pour l'instant. Swipez des exposants pour générer un parcours !`;
    const byHall = {};
    favorites.forEach(e => {
      const hall = parseStand(e.stand).hall;
      byHall[hall] = byHall[hall] || [];
      byHall[hall].push(e);
    });
    const halls = Object.keys(byHall).sort();
    return [
      `# Rapport de préparation de visite — ${eventName}`,
      ``,
      `*Généré le ${date} · ${favorites.length} exposants prioritaires*`,
      ``,
      ...halls.flatMap(hall => [
        `## Hall ${hall}`,
        ``,
        ...byHall[hall].map(e => `- **${e.name}** — Stand ${e.stand ?? "N/A"} (tier ${e.tier})`),
        ``,
      ]),
    ].join("\n");
  },
  fallback() {
    return "Je peux seulement répondre à partir de vos données de vote et d'exposants pour ce salon. Essayez une des suggestions ci-dessous, ou reformulez votre question autour des votes, tendances ou recommandations !";
  },
  answer(message, eventId, eventName, userId) {
    const m = message.toLowerCase();
    if (m.includes("rapport complet")) return this.fullReport(eventId, eventName);
    if (m.includes("rapport") && m.includes("visite")) return this.visitReport(eventId, eventName, userId);
    if (m.includes("top") || m.includes("mieux notés") || m.includes("classement")) return this.topExhibitors(eventId);
    if (m.includes("tendance")) return this.trends(eventId);
    if (m.includes("super like")) return this.mySuperlikes(eventId, userId);
    if (m.includes("tier")) return this.byTier(eventId);
    if (m.includes("consensus") || m.includes("unanime")) return this.consensus(eventId);
    if (m.includes("recommand") || m.includes("prioriser")) return this.recommendations(eventId, userId);
    if (m.includes("statist") || m.includes("résumé")) return this.stats(eventId);
    if (m.includes("secteur")) return this.sectors(eventId);
    return this.fallback();
  },
};

function isMarkdownReport(content) {
  return content.includes("##") || (content.includes("#") && content.length > 300);
}
function downloadMarkdown(content, filename) {
  const blob = new Blob([content], { type: "text/markdown;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function downloadCsv(content, filename) {
  const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ════════════════════════════════════════════════════════════════
   TOAST — minimal stand-in for the original "sonner" library.
   ════════════════════════════════════════════════════════════════ */

let toastListeners = [];
const toastState = { items: [] };
function pushToast(type, message) {
  const id = Math.random().toString(36).slice(2);
  toastState.items = [...toastState.items, { id, type, message }];
  toastListeners.forEach(l => l(toastState.items));
  setTimeout(() => {
    toastState.items = toastState.items.filter(t => t.id !== id);
    toastListeners.forEach(l => l(toastState.items));
  }, 3200);
}
const toast = {
  success: (msg) => pushToast("success", msg),
  error: (msg) => pushToast("error", msg),
};

function Toaster() {
  const [items, setItems] = useState(toastState.items);
  useEffect(() => {
    toastListeners.push(setItems);
    return () => { toastListeners = toastListeners.filter(l => l !== setItems); };
  }, []);
  return (
    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none">
      <AnimatePresence>
        {items.map(t => (
          <motion.div
            key={t.id}
            initial={{ opacity: 0, y: -12, scale: 0.95 }}
            animate={{ opacity: 1, y: 0, scale: 1 }}
            exit={{ opacity: 0, scale: 0.95 }}
            className={`px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium border pointer-events-auto ${
              t.type === "success" ? "bg-white text-emerald-700 border-emerald-200" : "bg-white text-red-700 border-red-200"
            }`}
          >
            {t.message}
          </motion.div>
        ))}
      </AnimatePresence>
    </div>
  );
}

const SWIPE_THRESHOLD = 80;

function SwipeCard({ exhibitor, onVote, onOpenSite, isTop, stackIndex }) {
  const [expanded, setExpanded] = useState(false);
  const [voteIndicator, setVoteIndicator] = useState(null);
  const x = useMotionValue(0);
  const y = useMotionValue(0);
  const controls = useAnimation();

  const rotate = useTransform(x, [-200, 0, 200], [-25, 0, 25]);
  const likeOpacity = useTransform(x, [20, 80], [0, 1]);
  const dislikeOpacity = useTransform(x, [-80, -20], [1, 0]);
  const superlikeOpacity = useTransform(y, [-80, -20], [1, 0]);

  const tags = (() => { try { return JSON.parse(exhibitor.thematicTags || "[]"); } catch { return []; } })();
  const tier = TIER_CONFIG[exhibitor.tier] ?? TIER_CONFIG.C;
  const description = exhibitor.description || exhibitor.shortDescription || "";
  const isLongDesc = description.length > 180;

  const handleDragEnd = async (_e, info) => {
    const { offset, velocity } = info;
    const swipeX = Math.abs(offset.x) > SWIPE_THRESHOLD || Math.abs(velocity.x) > 400;
    const swipeUp = offset.y < -SWIPE_THRESHOLD || velocity.y < -400;
    if (swipeUp) { await controls.start({ y: -700, opacity: 0, transition: { duration: 0.3 } }); onVote("superlike"); }
    else if (swipeX && offset.x > 0) { await controls.start({ x: 700, opacity: 0, rotate: 20, transition: { duration: 0.3 } }); onVote("like"); }
    else if (swipeX && offset.x < 0) { await controls.start({ x: -700, opacity: 0, rotate: -20, transition: { duration: 0.3 } }); onVote("dislike"); }
    else { controls.start({ x: 0, y: 0, rotate: 0, transition: { type: "spring", stiffness: 300, damping: 20 } }); }
  };

  const handleButtonVote = async (type) => {
    setVoteIndicator(type);
    await new Promise(r => setTimeout(r, 150));
    if (type === "like") await controls.start({ x: 700, opacity: 0, rotate: 20, transition: { duration: 0.35 } });
    else if (type === "dislike") await controls.start({ x: -700, opacity: 0, rotate: -20, transition: { duration: 0.35 } });
    else await controls.start({ y: -700, opacity: 0, transition: { duration: 0.35 } });
    onVote(type);
  };

  if (!isTop) {
    return (
      <div className={`absolute inset-0 rounded-2xl bg-card border border-border shadow-md ${stackIndex === 1 ? "card-stack-1" : "card-stack-2"}`} style={{ zIndex: 10 - stackIndex }} />
    );

function SwipePage({ eventId, eventName, onBack }) {
  const { user } = useAuthCtx();
  const totalForEvent = useMemo(() => db.getExhibitorsByEvent(eventId).length, [eventId]);
  const [queue, setQueue] = useState(() => db.getSwipeQueue(user.id, eventId).queue);
  const [totalSeen, setTotalSeen] = useState(() => totalForEvent - db.getSwipeQueue(user.id, eventId).queue.length);
  const [lastVoted, setLastVoted] = useState(null);
  const [siteUrl, setSiteUrl] = useState(null);

  const handleVote = useCallback((voteType) => {
    setQueue(q => {
      if (q.length === 0) return q;
      const current = q[0];
      db.castVote(user.id, current.id, eventId, voteType);
      setLastVoted({ exhibitor: current, voteType });
      setTotalSeen(s => s + 1);
      return q.slice(1);
    });
  }, [eventId, user.id]);

  const handleUndo = useCallback(() => {
    if (!lastVoted) return;
    db.deleteVote(user.id, lastVoted.exhibitor.id);
    setQueue(q => [lastVoted.exhibitor, ...q]);
    setTotalSeen(s => Math.max(0, s - 1));
    setLastVoted(null);
  }, [lastVoted, user.id]);

  const isDone = queue.length === 0;
  const displayRemaining = Math.max(0, totalForEvent - totalSeen);
  const progressPct = totalForEvent > 0 ? Math.min(100, Math.round((totalSeen / totalForEvent) * 100)) : 0;

  if (isDone) {
    return (
      <div className="flex flex-col items-center justify-center h-full gap-6 p-8 text-center">
        <motion.div initial={{ scale: 0 }} animate={{ scale: 1 }} transition={{ type: "spring" }}><CheckCircle2 className="w-20 h-20 text-green-500" /></motion.div>
        <h2 className="text-2xl font-black">Tous les exposants vus !</h2>
        <p className="text-muted-foreground text-sm">Vous avez évalué tous les exposants de {eventName}.</p>
        <Button onClick={onBack} variant="outline">Retour aux événements</Button>
      </div>
    );
  }

  return (
    <div className="flex flex-col h-full">
      <div className="flex-shrink-0 flex items-center justify-between px-4 py-3 border-b border-border bg-card/80 backdrop-blur-sm">
        <button onClick={onBack} className="flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground transition-colors"><ChevronLeft className="w-4 h-4" /> Retour</button>
        <div className="text-center">
          <p className="text-xs font-semibold text-muted-foreground truncate max-w-[140px]">{eventName}</p>
          <p className="text-xs text-muted-foreground font-medium">{displayRemaining} exposant{displayRemaining !== 1 ? "s" : ""} restant{displayRemaining !== 1 ? "s" : ""}</p>
        </div>
        <button onClick={handleUndo} disabled={!lastVoted} className="flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground disabled:opacity-30 transition-colors">
          <RotateCcw className="w-4 h-4" /> Annuler
        </button>
      </div>

      <div className="flex-shrink-0 h-1 bg-muted">
        <motion.div className="h-full bg-primary" animate={{ width: `${Math.max(progressPct > 0 ? 2 : 0, progressPct)}%` }} transition={{ duration: 0.4 }} />
      </div>

      <div className="flex-1 relative p-4 pb-2 min-h-0">
        <div className="relative h-full max-w-sm mx-auto">
          <AnimatePresence>
            {queue.slice(0, 3).map((exhibitor, index) => (
              <SwipeCard key={exhibitor.id} exhibitor={exhibitor} onVote={handleVote} onOpenSite={setSiteUrl} isTop={index === 0} stackIndex={index} />
            ))}
          </AnimatePresence>
        </div>
      </div>

      <div className="flex-shrink-0 flex justify-center gap-6 pb-3 text-xs text-muted-foreground">
        <span>← Pas intéressé</span><span>↑ Super like</span><span>Intéressé →</span>
      </div>

      <AnimatePresence>{siteUrl && <SiteEmbedModal url={siteUrl} onClose={() => setSiteUrl(null)} />}</AnimatePresence>
    </div>
  );
}

function standDistance(a, b) { const hallPenalty = a.hall !== b.hall ? 50 : 0; return Math.abs(a.num - b.num) + hallPenalty; }

function optimizePath(exhibitors) {
  if (exhibitors.length <= 2) return exhibitors;
  const parsed = exhibitors.map(e => ({ ...e, _stand: parseStand(e.stand) }));
  const halls = Array.from(new Set(parsed.map(e => e._stand.hall))).sort();
  const result = [];
  halls.forEach((hall, hi) => {
    const inHall = parsed.filter(e => e._stand.hall === hall);
    const sorted = inHall.sort((a, b) => a._stand.num - b._stand.num);
    if (hi % 2 === 1) sorted.reverse();
    result.push(...sorted);
  });
  return result;
}

function estimateTime(count) {
  const totalMin = count * 15;
  if (totalMin < 60) return `~${totalMin} min`;
  const h = Math.floor(totalMin / 60); const m = totalMin % 60;
  return m > 0 ? `~${h}h${m.toString().padStart(2, "0")}` : `~${h}h`;
}

  const myVotes = useMemo(() => db.getMyVotes(user.id, eventId), [eventId, user.id, version]);
  const favorites = useMemo(() => myVotes
    .filter(v => (v.voteType === "like" || v.voteType === "superlike") && v.exhibitor)
    .sort((a, b) => (a.voteType === "superlike" ? 3 : 1) < (b.voteType === "superlike" ? 3 : 1) ? 1 : -1)
    .map(v => ({ ...v.exhibitor, voteType: v.voteType })), [myVotes]);

  useEffect(() => {
    if (selected === null) setSelected(new Set(favorites.map(e => e.id)));
  }, [favorites, selected]);

  const selectedSet = selected ?? new Set();
  const selectedList = favorites.filter(e => selectedSet.has(e.id));
  const optimizedPath = useMemo(() => optimizePath(selectedList), [selectedList]);

  const toggleSelect = (id) => {
    setSelected(prev => { const next = new Set(prev ?? []); next.has(id) ? next.delete(id) : next.add(id); return next; });
    setShowPath(false);
  };
  const selectAll = () => { setSelected(new Set(favorites.map(e => e.id))); setShowPath(false); };
  const deselectAll = () => { setSelected(new Set()); setShowPath(false); };
  const handleDeleteVote = (exhibitorId) => { db.deleteVote(user.id, exhibitorId); refresh(); };
  const handleDeleteAll = () => { db.deleteAllVotes(user.id, eventId); setSelected(new Set()); setShowPath(false); setShowDeleteAllConfirm(false); refresh(); };

  const handleExportPlan = () => {
    const path = showPath ? optimizedPath : selectedList;
    if (path.length === 0) return;
    const slug = (eventName ?? "salon").replace(/\s+/g, "-").toLowerCase();
    const date = new Date().toLocaleDateString("fr-FR");
    const lines = [
      `# Plan de visite — ${eventName ?? "Salon"}`, ``,
      `**Exporté le** ${date} · **${path.length} stand${path.length > 1 ? "s" : ""}** · ${estimateTime(path.length)} estimé`, ``,
      `## Itinéraire`, ``,
      `| Étape | Exposant | Stand | Tier | Type de vote |`,
      `|-------|----------|-------|------|--------------|`,
      ...path.map((e, i) => `| ${i + 1} | **${e.name}** | ${e.stand ?? "N/A"} | ${e.tier} | ${e.voteType === "superlike" ? "⭐ Super Like" : "✅ Like"} |`),
    ];
    downloadMarkdown(lines.join("\n"), `plan-visite-${slug}-${new Date().toISOString().split("T")[0]}.md`);
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex-shrink-0 flex items-center justify-between px-4 py-3 border-b border-border bg-card/80 backdrop-blur-sm">
        <button onClick={onBack} className="flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground"><ChevronLeft className="w-4 h-4" /> Retour</button>
        <div className="text-center"><p className="text-sm font-bold flex items-center gap-1.5"><Navigation className="w-4 h-4 text-primary" /> Planification</p>{eventName && <p className="text-xs text-muted-foreground">{eventName}</p>}</div>
        {favorites.length > 0 ? (
          showDeleteAllConfirm ? (
            <div className="flex items-center gap-1">
              <button onClick={handleDeleteAll} className="text-xs text-red-600 font-semibold hover:text-red-700">Confirmer</button>
              <span className="text-muted-foreground text-xs">/</span>
              <button onClick={() => setShowDeleteAllConfirm(false)} className="text-xs text-muted-foreground hover:text-foreground">Annuler</button>
            </div>
          ) : (<button onClick={() => setShowDeleteAllConfirm(true)} className="flex items-center gap-1 text-xs text-muted-foreground hover:text-red-500 transition-colors" title="Supprimer tous mes votes"><Trash2 className="w-4 h-4" /></button>)
        ) : <div className="w-8" />}
      </div>

      {favorites.length === 0 ? (
        <div className="flex-1 flex flex-col items-center justify-center gap-4 p-8 text-center">
          <div className="text-5xl">🗺️</div><h2 className="text-xl font-bold">Aucun favori</h2>
          <p className="text-sm text-muted-foreground">Swipez les exposants et likez ceux qui vous intéressent pour construire votre plan de visite.</p>
          <Button onClick={onBack} variant="outline">Aller swiper</Button>
        </div>
      ) : (
        <>
          <div className="flex-1 overflow-y-auto scrollbar-hide">
            {!showPath && (
              <>
                <div className="px-4 pt-4 pb-2 flex items-center justify-between">
                  <p className="text-sm font-semibold text-foreground">{selectedSet.size} / {favorites.length} sélectionné{selectedSet.size > 1 ? "s" : ""}</p>
                  <div className="flex gap-2">
                    <button onClick={selectAll} className="text-xs text-primary font-semibold hover:underline">Tout sélectionner</button>
                    <span className="text-muted-foreground">·</span>
                    <button onClick={deselectAll} className="text-xs text-muted-foreground hover:text-foreground">Tout désélectionner</button>
                  </div>
                </div>
                <div className="px-4 pb-4 space-y-2">
                  {favorites.map((exhibitor, i) => {
                    const isSelected = selectedSet.has(exhibitor.id);
                    const tier = TIER_CONFIG[exhibitor.tier] ?? TIER_CONFIG.C;
                    return (
                      <motion.div key={exhibitor.id} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i * 0.02 }} onClick={() => toggleSelect(exhibitor.id)}
                        className={`flex items-center gap-3 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${isSelected ? "border-primary bg-primary/5 shadow-sm" : "border-border bg-card opacity-60"}`}>
                        <div className="flex-shrink-0">{isSelected ? <CheckSquare className="w-5 h-5 text-primary" /> : <Square className="w-5 h-5 text-muted-foreground" />}</div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-1.5 mb-0.5">
                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold border ${tier.bg} ${tier.text} ${tier.border}`}>{exhibitor.tier}</span>
                            <span className="font-bold text-sm truncate">{exhibitor.name}</span>
                          </div>
                          {exhibitor.stand ? (<div className="flex items-center gap-1"><MapPin className="w-3 h-3 text-muted-foreground flex-shrink-0" /><span className="text-xs text-muted-foreground">Stand {exhibitor.stand}</span></div>) : (<span className="text-xs text-muted-foreground/60 italic">Stand non renseigné</span>)}
                        </div>
                        <div className="flex-shrink-0 flex items-center gap-2">
                          {exhibitor.voteType === "superlike" ? <Star className="w-4 h-4 text-blue-500 fill-blue-500" /> : <Heart className="w-4 h-4 text-green-500 fill-green-500" />}
                          <button onClick={e => { e.stopPropagation(); handleDeleteVote(exhibitor.id); }} className="w-7 h-7 rounded-lg flex items-center justify-center text-muted-foreground hover:text-red-500 hover:bg-red-50 transition-colors" title="Supprimer ce vote"><Trash2 className="w-3.5 h-3.5" /></button>
                        </div>
                      </motion.div>
                    );
                  })}
                </div>
              </>
            )}

            {showPath && (
              <>
                <div className="px-4 pt-4 pb-3">
                  <div className="bg-gradient-to-br from-primary/10 to-accent/20 border border-primary/20 rounded-2xl p-4">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-primary/20 flex items-center justify-center"><Route className="w-5 h-5 text-primary" /></div>
                      <div><p className="font-bold text-sm text-foreground">Chemin optimisé</p><p className="text-xs text-muted-foreground">{optimizedPath.length} stand{optimizedPath.length > 1 ? "s" : ""} · {estimateTime(optimizedPath.length)}</p></div>
                      <div className="ml-auto flex items-center gap-1 text-xs text-muted-foreground"><Clock className="w-3.5 h-3.5" />{estimateTime(optimizedPath.length)}</div>
                    </div>
                  </div>
                </div>
                <div className="px-4 pb-4 space-y-2">
                  {optimizedPath.map((exhibitor, i) => {
                    const tier = TIER_CONFIG[exhibitor.tier] ?? TIER_CONFIG.C;
                    const isLast = i === optimizedPath.length - 1;
                    return (
                      <div key={exhibitor.id} className="relative">
                        {!isLast && <div className="absolute left-[22px] top-[52px] w-0.5 h-4 bg-primary/20 z-0" />}
                        <motion.div initial={{ opacity: 0, x: -10 }} animate={{ opacity: 1, x: 0 }} transition={{ delay: i * 0.04 }} className="relative z-10 flex items-start gap-3 bg-card border border-border rounded-2xl p-3.5 shadow-sm">
                          <div className={`flex-shrink-0 w-9 h-9 rounded-xl flex items-center justify-center font-black text-sm ${i === 0 ? "bg-primary text-primary-foreground" : i === optimizedPath.length - 1 ? "bg-green-500 text-white" : "bg-primary/10 text-primary"}`}>
                            {i === 0 ? "▶" : i === optimizedPath.length - 1 ? "✓" : i + 1}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-1.5 mb-0.5">
                              <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold border ${tier.bg} ${tier.text} ${tier.border}`}>{exhibitor.tier}</span>
                              <span className="font-bold text-sm truncate">{exhibitor.name}</span>
                            </div>
                            {exhibitor.stand ? (<div className="flex items-center gap-1"><MapPin className="w-3 h-3 text-primary flex-shrink-0" /><span className="text-xs font-semibold text-primary">Stand {exhibitor.stand}</span></div>) : (<span className="text-xs text-muted-foreground/60 italic">Stand non renseigné</span>)}
                            {exhibitor.shortDescription && <p className="text-xs text-muted-foreground mt-0.5 line-clamp-1">{exhibitor.shortDescription}</p>}
                          </div>
                          <div className="flex-shrink-0 flex flex-col gap-1.5 items-end">
                            {exhibitor.voteType === "superlike" ? <Star className="w-3.5 h-3.5 text-blue-500 fill-blue-500" /> : <Heart className="w-3.5 h-3.5 text-green-500 fill-green-500" />}
                            {exhibitor.website && (<button onClick={() => setSiteUrl(exhibitor.website)} className="w-7 h-7 rounded-lg bg-muted flex items-center justify-center hover:bg-primary/10 transition-colors"><Globe className="w-3.5 h-3.5 text-muted-foreground" /></button>)}
                          </div>
                        </motion.div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>

          <div className="flex-shrink-0 p-4 border-t border-border bg-card/95 space-y-2">
            {!showPath ? (
              <Button className="w-full gap-2" disabled={selectedSet.size === 0} onClick={() => setShowPath(true)}>
                <Route className="w-4 h-4" /> Générer le chemin optimisé ({selectedSet.size} stands) <ArrowRightIcon className="w-4 h-4 ml-auto" />
              </Button>
            ) : (
              <>
                <div className="flex gap-2">
                  <Button variant="outline" className="flex-1 gap-2" onClick={() => setShowPath(false)}><RotateCcw className="w-4 h-4" /> Modifier</Button>
                  <Button variant="outline" className="flex-1 gap-2" onClick={() => { setShowPath(false); setTimeout(() => setShowPath(true), 100); }}><Shuffle className="w-4 h-4" /> Recalculer</Button>
                </div>
                <Button variant="outline" className="w-full gap-2" onClick={handleExportPlan} disabled={optimizedPath.length === 0}><Download className="w-4 h-4" /> Exporter le plan de visite</Button>
              </>
            )}
          </div>
        </>
      )}

      <AnimatePresence>{siteUrl && <SiteEmbedModal url={siteUrl} onClose={() => setSiteUrl(null)} />}</AnimatePresence>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   TEAM SETUP
   ════════════════════════════════════════════════════════════════ */

function TeamSetup({ eventId, eventName, onBack }) {
  const { user } = useAuthCtx();
  const [newTeamName, setNewTeamName] = useState("");
  const [inviteUrl, setInviteUrl] = useState(null);
  const [copied, setCopied] = useState(false);
  const [mode, setMode] = useState("view");
  const [version, setVersion] = useState(0);
  const refresh = () => setVersion(v => v + 1);

  const myTeam = useMemo(() => db.getMyTeam(user.id, eventId), [eventId, user.id, version]);
  const allTeams = useMemo(() => db.getTeams(eventId), [eventId, version]);

  const handleCreateTeam = () => {
    if (!newTeamName.trim()) return;
    db.createTeam(user.id, newTeamName.trim(), eventId);
    toast.success("Équipe créée !");
    setNewTeamName(""); setMode("view"); refresh();
  };
  const handleJoinTeam = (teamId) => {
    db.joinTeam(user.id, teamId, eventId);
    toast.success("Vous avez rejoint l'équipe !");
    setMode("view"); refresh();
  };
  const handleCreateInvite = () => {
    if (!myTeam) return;
    const token = db.createInviteToken(user.id, myTeam.id);
    setInviteUrl(`${window.location.origin}${window.location.pathname}#/join?token=${token}`);
  };
  const handleCopy = async () => {
    if (!inviteUrl) return;
    try { await navigator.clipboard.writeText(inviteUrl); } catch {}
    setCopied(true); toast.success("Lien copié !");
    setTimeout(() => setCopied(false), 2000);
  };
  const handleShareEmail = () => {
    if (!inviteUrl) return;
    const subject = encodeURIComponent(`Rejoins mon équipe sur SalonSwipe — ${eventName ?? ""}`);
    const body = encodeURIComponent(`Bonjour,\n\nJe t'invite à rejoindre mon équipe sur SalonSwipe pour préparer notre visite du salon ${eventName ?? ""}.\n\nClique sur ce lien pour rejoindre :\n${inviteUrl}\n\nÀ bientôt !`);
    window.open(`mailto:?subject=${subject}&body=${body}`);
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex-shrink-0 flex items-center justify-between px-4 py-3 border-b border-border bg-card/80 backdrop-blur-sm">
        <button onClick={onBack} className="flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground"><ChevronLeft className="w-4 h-4" /> Retour</button>
        <div className="text-center"><p className="text-sm font-bold flex items-center gap-1.5"><Users className="w-4 h-4 text-primary" /> Équipes</p>{eventName && <p className="text-xs text-muted-foreground">{eventName}</p>}</div>
        <div className="w-16" />
      </div>

      <div className="flex-1 overflow-y-auto scrollbar-hide px-4 py-4 space-y-5">
        {myTeam ? (
          <motion.div initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }}>
            <div className="bg-gradient-to-br from-primary/10 to-accent/20 border border-primary/20 rounded-2xl p-4">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-10 h-10 rounded-xl bg-primary/20 flex items-center justify-center"><Crown className="w-5 h-5 text-primary" /></div>
                <div><p className="font-black text-base text-foreground">{myTeam.name}</p><p className="text-xs text-muted-foreground">Mon équipe · {myTeam.members?.length ?? 0} membre{(myTeam.members?.length ?? 0) > 1 ? "s" : ""}</p></div>
              </div>
              <div className="flex flex-wrap gap-2 mb-4">
                {(myTeam.members ?? []).map(m => (
                  <div key={m.id} className="flex items-center gap-1.5 bg-white/60 border border-primary/20 rounded-full px-2.5 py-1">
                    <div className="w-5 h-5 rounded-full bg-primary/20 flex items-center justify-center"><span className="text-[10px] font-bold text-primary">{m.name?.charAt(0)?.toUpperCase() ?? "?"}</span></div>
                    <span className="text-xs font-medium text-foreground">{m.name?.split(" ")[0] ?? "Anonyme"}</span>
                  </div>
                ))}
              </div>
              {!inviteUrl ? (
                <Button size="sm" variant="outline" className="w-full gap-2 bg-white/60" onClick={handleCreateInvite}><Link2 className="w-4 h-4" /> Générer un lien d'invitation</Button>
              ) : (
                <div className="space-y-2">
                  <div className="flex items-center gap-2 bg-white/80 border border-border rounded-xl p-2.5">
                    <p className="text-xs text-muted-foreground flex-1 truncate">{inviteUrl}</p>
                    <button onClick={handleCopy} className="flex-shrink-0">{copied ? <Check className="w-4 h-4 text-green-500" /> : <Copy className="w-4 h-4 text-muted-foreground" />}</button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <Button size="sm" variant="outline" className="gap-1.5 text-xs" onClick={handleCopy}>{copied ? <Check className="w-3.5 h-3.5" /> : <Copy className="w-3.5 h-3.5" />} Copier</Button>
                    <Button size="sm" variant="outline" className="gap-1.5 text-xs" onClick={handleShareEmail}><Mail className="w-3.5 h-3.5" /> Envoyer par mail</Button>
                  </div>
                </div>
              )}
            </div>
          </motion.div>
        ) : (
          <motion.div initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }}>
            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center">
              <p className="text-sm font-semibold text-amber-800 mb-1">Vous n'avez pas encore d'équipe</p>
              <p className="text-xs text-amber-700">Créez une équipe ou rejoignez-en une pour partager vos votes.</p>
            </div>
          </motion.div>
        )}

        <AnimatePresence mode="wait">
          {mode === "view" && (
            <motion.div key="view" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="grid grid-cols-2 gap-3">
              <button onClick={() => setMode("create")} className="flex flex-col items-center gap-2 p-4 rounded-2xl bg-card border-2 border-border hover:border-primary/40 transition-all">
                <div className="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center"><Plus className="w-5 h-5 text-primary" /></div>
                <p className="text-xs font-bold text-foreground">Créer une équipe</p>
              </button>
              <button onClick={() => setMode("join")} className="flex flex-col items-center gap-2 p-4 rounded-2xl bg-card border-2 border-border hover:border-primary/40 transition-all">
                <div className="w-10 h-10 rounded-xl bg-green-50 border border-green-200 flex items-center justify-center"><LogIn className="w-5 h-5 text-green-600" /></div>
                <p className="text-xs font-bold text-foreground">Rejoindre</p>
              </button>
            </motion.div>
          )}

          {mode === "create" && (
            <motion.div key="create" initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="space-y-3">
              <h3 className="font-bold text-sm text-foreground">Créer une nouvelle équipe</h3>
              <input type="text" placeholder="Nom de l'équipe (ex: Équipe Achats)" value={newTeamName} onChange={e => setNewTeamName(e.target.value)} maxLength={50}
                className="w-full px-4 py-3 rounded-xl border border-border bg-card text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" />
              <div className="flex gap-2">
                <Button variant="outline" className="flex-1" onClick={() => setMode("view")}>Annuler</Button>
                <Button className="flex-1 gap-2" disabled={!newTeamName.trim()} onClick={handleCreateTeam}><Plus className="w-4 h-4" /> Créer</Button>
              </div>
            </motion.div>
          )}

          {mode === "join" && (
            <motion.div key="join" initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="space-y-3">
              <h3 className="font-bold text-sm text-foreground">Rejoindre une équipe</h3>
              {allTeams.length === 0 ? (
                <div className="text-center py-6"><p className="text-sm text-muted-foreground">Aucune équipe disponible pour cet événement.</p></div>
              ) : (
                <div className="space-y-2">
                  {allTeams.map(team => (
                    <div key={team.id} className={`flex items-center justify-between p-3.5 rounded-xl border-2 ${myTeam?.id === team.id ? "border-primary bg-primary/5" : "border-border bg-card"}`}>
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center"><Users className="w-4 h-4 text-primary" /></div>
                        <div><p className="font-semibold text-sm text-foreground">{team.name}</p></div>
                      </div>
                      {myTeam?.id === team.id ? (<span className="text-xs text-primary font-bold">Mon équipe</span>) : (
                        <Button size="sm" variant="outline" className="gap-1.5 text-xs" onClick={() => handleJoinTeam(team.id)}><UserPlus className="w-3.5 h-3.5" /> Rejoindre</Button>
                      )}
                    </div>
                  ))}
                </div>
              )}
              <Button variant="outline" className="w-full" onClick={() => setMode("view")}>Retour</Button>
            </motion.div>
          )}
        </AnimatePresence>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   EVENT INFO MODAL
   ════════════════════════════════════════════════════════════════ */

function getNavLinks(location) {
  const encoded = encodeURIComponent(location);
  return [
    { name: "Google Maps", icon: "🗺️", url: `https://www.google.com/maps/search/?api=1&query=${encoded}`, color: "bg-blue-50 border-blue-200 text-blue-700" },
    { name: "Waze", icon: "🚗", url: `https://waze.com/ul?q=${encoded}&navigate=yes`, color: "bg-sky-50 border-sky-200 text-sky-700" },
    { name: "Apple Plans", icon: "🍎", url: `maps://maps.apple.com/?q=${encoded}`, color: "bg-gray-50 border-gray-200 text-gray-700" },
    { name: "Maps (web)", icon: "📍", url: `https://maps.apple.com/?q=${encoded}`, color: "bg-orange-50 border-orange-200 text-orange-700" },
  ];
}

function EventInfoModal({ event, onClose }) {
  if (!event) return null;
  const navLinks = event.location ? getNavLinks(event.location) : [];
  return (
    <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center" onClick={onClose}>
      <motion.div initial={{ y: "100%" }} animate={{ y: 0 }} exit={{ y: "100%" }} transition={{ type: "spring", damping: 30, stiffness: 300 }} className="w-full max-w-sm bg-card rounded-t-3xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
        <div className="flex justify-center pt-3 pb-1"><div className="w-10 h-1 rounded-full bg-muted-foreground/20" /></div>
        <div className="mx-4 rounded-2xl p-4 mb-4 text-white" style={{ backgroundColor: event.color ?? "#2C3E7A" }}>
          <div className="flex items-start justify-between">
            <div className="flex-1">
              <h2 className="text-xl font-black leading-tight">{event.name}</h2>
              {event.location && (<div className="flex items-center gap-1.5 mt-1.5"><MapPin className="w-3.5 h-3.5 opacity-80 flex-shrink-0" /><p className="text-sm opacity-90">{event.location}</p></div>)}
              {event.startDate && (<div className="flex items-center gap-1.5 mt-1"><Calendar className="w-3.5 h-3.5 opacity-80 flex-shrink-0" /><p className="text-sm opacity-90">{event.startDate}{event.endDate && event.endDate !== event.startDate ? ` → ${event.endDate}` : ""}</p></div>)}
            </div>
            <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center flex-shrink-0 ml-2"><X className="w-4 h-4" /></button>
          </div>
        </div>
        <div className="px-4 pb-6 space-y-4">
          {event.description && (<div><h3 className="text-xs font-bold text-muted-foreground uppercase tracking-wide mb-2">À propos</h3><p className="text-sm text-foreground leading-relaxed">{event.description}</p></div>)}
          {event.location && (
            <div>
              <h3 className="text-xs font-bold text-muted-foreground uppercase tracking-wide mb-2 flex items-center gap-1.5"><Navigation className="w-3.5 h-3.5" /> Ouvrir dans</h3>
              <div className="grid grid-cols-2 gap-2">
                {navLinks.map(link => (
                  <a key={link.name} href={link.url} target="_blank" rel="noopener noreferrer" className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border text-sm font-semibold transition-opacity hover:opacity-80 ${link.color}`}>
                    <span className="text-base">{link.icon}</span><span>{link.name}</span><ExternalLink className="w-3 h-3 ml-auto opacity-60" />
                  </a>
                ))}
              </div>
              <p className="text-[11px] text-muted-foreground mt-2 text-center">{event.location}</p>
            </div>
          )}
          <Button variant="outline" className="w-full" onClick={onClose}>Fermer</Button>
        </div>
      </motion.div>
    </motion.div>
  );
}

/* ════════════════════════════════════════════════════════════════
   AI CHAT BOT
   ════════════════════════════════════════════════════════════════ */

const SUGGESTED_PROMPTS = [
  { icon: "🏆", label: "Top exposants", prompt: "Quels sont les exposants les mieux notés par l'équipe ?" },
  { icon: "📊", label: "Tendances", prompt: "Quelles sont les grandes tendances des votes de l'équipe ?" },
  { icon: "⭐", label: "Mes super likes", prompt: "Quels exposants ai-je mis en super like ?" },
  { icon: "🏷️", label: "Par tier", prompt: "Comment se répartissent les votes par tier (A, B, C, D) ?" },
  { icon: "🤝", label: "Consensus", prompt: "Sur quels exposants l'équipe est-elle la plus unanime ?" },
  { icon: "💡", label: "Recommandations", prompt: "Quels exposants devrais-je prioriser lors de ma visite ?" },
  { icon: "📈", label: "Statistiques", prompt: "Donne-moi un résumé statistique des votes." },
  { icon: "🔍", label: "Secteurs", prompt: "Quels secteurs d'activité ont le plus de votes positifs ?" },
  { icon: "📝", label: "Rapport complet", prompt: "Génère un rapport complet d'analyse des votes de l'équipe pour ce salon, avec classement, tendances, consensus et recommandations. Formate-le en Markdown avec des sections claires." },
  { icon: "🗺️", label: "Rapport visite", prompt: "Génère un rapport de préparation de visite avec les exposants prioritaires à voir en premier, organisés par hall si possible. Formate-le en Markdown." },
];

function AIChatBot({ eventId, eventName, onClose }) {
  const { user } = useAuthCtx();
  const [messages, setMessages] = useState([
    { role: "assistant", content: `Bonjour ! Je suis votre assistant d'analyse pour ${eventName ?? "ce salon"}. Je peux analyser les votes, identifier les tendances, et **générer des rapports exportables en Markdown**. Utilisez les suggestions ci-dessous ou posez votre question.` },
  ]);
  const [input, setInput] = useState("");
  const [showSuggestions, setShowSuggestions] = useState(true);
  const [pending, setPending] = useState(false);
  const messagesEndRef = useRef(null);

  useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  const handleSend = (text) => {
    const message = (text ?? input).trim();
    if (!message || pending) return;
    setMessages(prev => [...prev, { role: "user", content: message }]);
    setInput(""); setShowSuggestions(false); setPending(true);
    setTimeout(() => {
      const reply = AI.answer(message, eventId, eventName, user.id);
      setMessages(prev => [...prev, { role: "assistant", content: reply, isReport: isMarkdownReport(reply) }]);
      setPending(false);
    }, 550);
  };

  const handleKeyDown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } };
  const handleExportMessage = (content, index) => {
    const slug = (eventName ?? "salon").replace(/\s+/g, "-").toLowerCase();
    const date = new Date().toISOString().split("T")[0];
    const fullContent = content.startsWith("#") ? content : `# Rapport IA — ${eventName ?? "Salon"}\n\n*Généré le ${new Date().toLocaleDateString("fr-FR")}*\n\n${content}`;
    downloadMarkdown(fullContent, `rapport-ia-${slug}-${date}-${index}.md`);
  };

  return (
    <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center" onClick={onClose}>
      <motion.div initial={{ y: "100%" }} animate={{ y: 0 }} exit={{ y: "100%" }} transition={{ type: "spring", damping: 30, stiffness: 300 }} className="w-full max-w-sm bg-card rounded-t-3xl shadow-2xl flex flex-col" style={{ maxHeight: "85vh" }} onClick={e => e.stopPropagation()}>
        <div className="flex justify-center pt-3 pb-1 flex-shrink-0"><div className="w-10 h-1 rounded-full bg-muted-foreground/20" /></div>
        <div className="flex-shrink-0 flex items-center justify-between px-4 py-3 border-b border-border">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-primary to-primary/60 flex items-center justify-center"><Bot className="w-4 h-4 text-white" /></div>
            <div><p className="font-bold text-sm text-foreground flex items-center gap-1">Assistant IA <Sparkles className="w-3.5 h-3.5 text-primary" /></p><p className="text-xs text-muted-foreground">Analyse locale · Rapports exportables</p></div>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-muted flex items-center justify-center"><X className="w-4 h-4 text-muted-foreground" /></button>
        </div>

        <div className="flex-1 overflow-y-auto scrollbar-hide px-4 py-3 space-y-3 min-h-0">
          {messages.map((msg, i) => (
            <motion.div key={i} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
              {msg.role === "assistant" && (<div className="w-6 h-6 rounded-full bg-primary/10 flex items-center justify-center mr-2 flex-shrink-0 mt-0.5"><Bot className="w-3.5 h-3.5 text-primary" /></div>)}
              <div className="max-w-[80%] flex flex-col gap-1.5">
                <div className={`px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ${msg.role === "user" ? "bg-primary text-primary-foreground rounded-br-sm" : "bg-muted text-foreground rounded-bl-sm"}`}>{msg.content}</div>
                {msg.role === "assistant" && msg.isReport && (
                  <button onClick={() => handleExportMessage(msg.content, i)} className="flex items-center gap-1.5 self-start px-2.5 py-1 rounded-lg bg-primary/10 border border-primary/20 text-xs font-medium text-primary hover:bg-primary/20 transition-colors">
                    <Download className="w-3 h-3" /> Exporter en Markdown
                  </button>
                )}
              </div>
            </motion.div>
          ))}
          {pending && (
            <div className="flex justify-start">
              <div className="w-6 h-6 rounded-full bg-primary/10 flex items-center justify-center mr-2 flex-shrink-0 mt-0.5"><Bot className="w-3.5 h-3.5 text-primary" /></div>
              <div className="bg-muted px-4 py-3 rounded-2xl rounded-bl-sm flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-muted-foreground animate-bounce" style={{ animationDelay: "0ms" }} />
                <span className="w-1.5 h-1.5 rounded-full bg-muted-foreground animate-bounce" style={{ animationDelay: "150ms" }} />
                <span className="w-1.5 h-1.5 rounded-full bg-muted-foreground animate-bounce" style={{ animationDelay: "300ms" }} />
              </div>
            </div>
          )}
          <div ref={messagesEndRef} />
        </div>

        <AnimatePresence>
          {showSuggestions && messages.length <= 1 && (
            <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: "auto" }} exit={{ opacity: 0, height: 0 }} className="flex-shrink-0 px-4 pb-2">
              <div className="flex items-center justify-between mb-2">
                <p className="text-xs font-semibold text-muted-foreground flex items-center gap-1"><FileText className="w-3 h-3" /> Suggestions & rapports</p>
                <button onClick={() => setShowSuggestions(false)} className="text-muted-foreground"><ChevronDown className="w-3.5 h-3.5" /></button>
              </div>
              <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
                {SUGGESTED_PROMPTS.map((s, i) => (
                  <button key={i} onClick={() => handleSend(s.prompt)} className="flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary/10 border border-primary/20 text-xs font-medium text-primary hover:bg-primary/20 transition-colors">
                    <span>{s.icon}</span><span>{s.label}</span>
                  </button>
                ))}
              </div>
            </motion.div>
          )}
        </AnimatePresence>

        <div className="flex-shrink-0 px-4 pb-6 pt-2 border-t border-border">
          <div className="flex items-center gap-2 bg-muted rounded-2xl px-3 py-2">
            <input type="text" placeholder="Posez votre question ou demandez un rapport..." value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown}
              className="flex-1 bg-transparent text-sm outline-none text-foreground placeholder:text-muted-foreground" disabled={pending} />
            <button onClick={() => handleSend()} disabled={!input.trim() || pending} className="w-8 h-8 rounded-xl bg-primary flex items-center justify-center disabled:opacity-40 transition-opacity">
              {pending ? <Loader2 className="w-4 h-4 text-white animate-spin" /> : <Send className="w-4 h-4 text-white" />}
            </button>
          </div>
        </div>
      </motion.div>
    </motion.div>
  );
}

/* ════════════════════════════════════════════════════════════════
   HOME (dashboard shell)
   ════════════════════════════════════════════════════════════════ */

function Home() {
  const { user, logout } = useAuthCtx();
  const [view, setView] = useState("home");
  const [selectedEvent, setSelectedEvent] = useState(null);
  const [showEventInfo, setShowEventInfo] = useState(false);
  const [showChatBot, setShowChatBot] = useState(false);
  const [version, setVersion] = useState(0);

  const events = db.getEvents();
  const myStats = selectedEvent ? db.getVoteStats(selectedEvent.id) : null;

  const handleExport = () => {
    if (!selectedEvent) return;
    const result = db.exportCsv(user.id, selectedEvent.id, "mine");
    if (result.count === 0) { toast.error("Aucun vote à exporter"); return; }
    downloadCsv(result.csv, `votes-${selectedEvent.name}-${new Date().toISOString().split("T")[0]}.csv`);
    toast.success(`${result.count} votes exportés !`);
  };

  const pickEvent = (event) => setSelectedEvent({
    id: event.id, name: event.name, color: event.color ?? "#2C3E7A", slug: event.slug,
    location: event.location, startDate: event.startDate, endDate: event.endDate, description: event.description,
  });

  if (view === "swipe" && selectedEvent) return (<div className="h-screen flex flex-col max-w-sm mx-auto"><SwipePage eventId={selectedEvent.id} eventName={selectedEvent.name} onBack={() => { setView("home"); setVersion(v => v + 1); }} /></div>);
  if (view === "team") return (<div className="h-screen flex flex-col max-w-sm mx-auto"><TeamView eventId={selectedEvent?.id} eventName={selectedEvent?.name} onBack={() => { setView("home"); setVersion(v => v + 1); }} /></div>);
  if (view === "plan") return (<div className="h-screen flex flex-col max-w-sm mx-auto"><PlanView eventId={selectedEvent?.id} eventName={selectedEvent?.name} onBack={() => { setView("home"); setVersion(v => v + 1); }} /></div>);
  if (view === "teamsetup" && selectedEvent) return (<div className="h-screen flex flex-col max-w-sm mx-auto"><TeamSetup eventId={selectedEvent.id} eventName={selectedEvent.name} onBack={() => { setView("home"); setVersion(v => v + 1); }} /></div>);

  return (
    <div className="min-h-screen max-w-sm mx-auto flex flex-col">
      <div className="flex-shrink-0 px-4 pt-12 pb-6">
        <div className="flex items-center justify-between mb-8">
          <div><h1 className="text-3xl font-black text-foreground tracking-tight">Salon<span className="text-primary">Swipe</span></h1><p className="text-sm text-muted-foreground mt-0.5">Préparez vos salons pro</p></div>
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center"><span className="text-sm font-bold text-primary">{user?.name?.charAt(0)?.toUpperCase() ?? "?"}</span></div>
            <button onClick={() => { logout(); navigate("#/"); }} className="text-muted-foreground hover:text-foreground"><LogOut className="w-4 h-4" /></button>
          </div>
        </div>

        {user && (
          <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="bg-gradient-to-br from-primary/10 to-accent/20 border border-primary/20 rounded-2xl p-4 mb-6">
            <p className="text-sm font-semibold text-foreground">Bonjour, {user.name?.split(" ")[0]} 👋</p>
            <p className="text-xs text-muted-foreground mt-0.5">Prêt à découvrir les exposants ?</p>
          </motion.div>
        )}
      </div>

      <div className="flex-1 px-4 pb-8 space-y-6">
        <div>
          <h2 className="text-sm font-bold text-muted-foreground uppercase tracking-wide mb-3">Événements disponibles</h2>
          <div className="space-y-3">
            {events.map((event, i) => (
              <motion.div key={event.id} initial={{ opacity: 0, y: 15 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i * 0.1 }}>
                <div className={`rounded-2xl border-2 p-4 cursor-pointer transition-all ${selectedEvent?.id === event.id ? "border-primary bg-primary/5 shadow-md" : "border-border bg-card hover:border-primary/40 hover:shadow-sm"}`} onClick={() => pickEvent(event)}>
                  <div className="flex items-start gap-3">
                    <div className="w-12 h-12 rounded-xl flex items-center justify-center text-white font-black text-lg flex-shrink-0" style={{ backgroundColor: event.color ?? "#2C3E7A" }}>{event.name.charAt(0)}</div>
                    <div className="flex-1 min-w-0">
                      <h3 className="font-bold text-sm text-foreground">{event.name}</h3>
                      {event.location && <p className="text-xs text-muted-foreground mt-0.5">📍 {event.location}</p>}
                      {event.startDate && <p className="text-xs text-muted-foreground">📅 {event.startDate}{event.endDate && event.endDate !== event.startDate ? ` → ${event.endDate}` : ""}</p>}
                    </div>
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      {selectedEvent?.id === event.id && (<div className="w-5 h-5 rounded-full bg-primary flex items-center justify-center"><span className="text-white text-xs">✓</span></div>)}
                      <button onClick={e => { e.stopPropagation(); pickEvent(event); setShowEventInfo(true); }} className="w-7 h-7 rounded-lg bg-muted hover:bg-primary/10 flex items-center justify-center transition-colors"><Info className="w-3.5 h-3.5 text-muted-foreground" /></button>
                    </div>
                  </div>
                </div>
              </motion.div>
            ))}
          </div>
        </div>

        {selectedEvent && (
          <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="space-y-3">
            <h2 className="text-sm font-bold text-muted-foreground uppercase tracking-wide">Actions — {selectedEvent.name.split(" ")[0]}</h2>

            <button onClick={() => setView("swipe")} className="w-full flex items-center gap-4 p-4 rounded-2xl bg-primary text-primary-foreground shadow-lg active:scale-98 transition-transform">
              <div className="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center"><Zap className="w-5 h-5" /></div>
              <div className="text-left"><p className="font-bold text-sm">Swiper les exposants</p><p className="text-xs opacity-80">Évaluez chaque exposant rapidement</p></div>
              <span className="ml-auto text-xl">→</span>
            </button>

            <div className="grid grid-cols-2 gap-3">
              <button onClick={() => setView("team")} className="flex flex-col items-start gap-2 p-4 rounded-2xl bg-card border-2 border-border hover:border-primary/40 transition-all">
                <div className="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center"><Users className="w-4.5 h-4.5 text-primary" /></div>
                <div><p className="font-bold text-xs text-foreground">Vue équipe</p><p className="text-[11px] text-muted-foreground">Classement votes</p></div>
              </button>
              <button onClick={() => setView("plan")} className="flex flex-col items-start gap-2 p-4 rounded-2xl bg-card border-2 border-border hover:border-primary/40 transition-all">
                <div className="w-9 h-9 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center"><Navigation className="w-4.5 h-4.5 text-emerald-600" /></div>
                <div><p className="font-bold text-xs text-foreground">Planifier</p><p className="text-[11px] text-muted-foreground">Chemin optimisé</p></div>
              </button>
              <button onClick={() => setView("teamsetup")} className="flex flex-col items-start gap-2 p-4 rounded-2xl bg-card border-2 border-border hover:border-primary/40 transition-all">
                <div className="w-9 h-9 rounded-xl bg-violet-50 border border-violet-200 flex items-center justify-center"><UserPlus className="w-4.5 h-4.5 text-violet-600" /></div>
                <div><p className="font-bold text-xs text-foreground">Équipes</p><p className="text-[11px] text-muted-foreground">Inviter des collègues</p></div>
              </button>
              <button onClick={() => setShowChatBot(true)} className="flex flex-col items-start gap-2 p-4 rounded-2xl bg-card border-2 border-border hover:border-primary/40 transition-all">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-primary/20 to-accent/30 flex items-center justify-center"><Bot className="w-4.5 h-4.5 text-primary" /></div>
                <div><p className="font-bold text-xs text-foreground">Assistant IA</p><p className="text-[11px] text-muted-foreground">Analyse des votes</p></div>
              </button>
            </div>

            <button onClick={handleExport} className="w-full flex items-center gap-3 p-3.5 rounded-2xl bg-muted/50 border border-border hover:border-primary/30 transition-all">
              <div className="w-8 h-8 rounded-lg bg-card border border-border flex items-center justify-center"><Download className="w-4 h-4 text-muted-foreground" /></div>
              <div className="text-left"><p className="font-semibold text-xs text-foreground">Exporter mes votes</p><p className="text-[11px] text-muted-foreground">Télécharger en CSV</p></div>
              <span className="ml-auto text-xs text-muted-foreground">CSV</span>
            </button>

            {myStats && (myStats.likes + myStats.superlikes + myStats.dislikes) > 0 && (
              <div className="bg-muted/50 rounded-2xl p-4">
                <p className="text-xs font-semibold text-muted-foreground mb-3 flex items-center gap-1"><BarChart3 className="w-3.5 h-3.5" /> Vos votes sur {selectedEvent.name.split(" ")[0]}</p>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div><p className="text-xl font-black text-green-600">{myStats.likes}</p><p className="text-xs text-muted-foreground">Likes</p></div>
                  <div><p className="text-xl font-black text-blue-600">{myStats.superlikes}</p><p className="text-xs text-muted-foreground">Super Likes</p></div>
                  <div><p className="text-xl font-black text-red-600">{myStats.dislikes}</p><p className="text-xs text-muted-foreground">Skips</p></div>
                </div>
              </div>
            )}
          </motion.div>
        )}

        {!selectedEvent && (<div className="text-center py-4"><p className="text-sm text-muted-foreground">👆 Sélectionnez un événement pour commencer</p></div>)}
      </div>

      <AnimatePresence>{showEventInfo && selectedEvent && <EventInfoModal event={selectedEvent} onClose={() => setShowEventInfo(false)} />}</AnimatePresence>
      <AnimatePresence>{showChatBot && <AIChatBot eventId={selectedEvent?.id} eventName={selectedEvent?.name} onClose={() => setShowChatBot(false)} />}</AnimatePresence>
    </div>
  );
}

function ProtectedApp() {
  const { isAuthenticated } = useAuthCtx();
  useEffect(() => { if (!isAuthenticated) navigate("#/login"); }, [isAuthenticated]);
  if (!isAuthenticated) return null;
  return <Home />;
}

function NotFoundPage() {
  return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-4 text-center p-8">
      <h2 className="text-2xl font-black">Page introuvable</h2>
      <Button onClick={() => navigate("#/")}>Retour à l'accueil</Button>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   ROOT + ROUTER
   ════════════════════════════════════════════════════════════════ */

function Root() {
  const [user, setUserState] = useState(() => Auth.getUser());
  const login = (u) => { Auth.login(u); setUserState(u); };
  const logout = () => { Auth.logout(); setUserState(null); };
  const authValue = { user, isAuthenticated: !!user, login, logout };

  const hash = useHashRoute();
  const withoutHash = hash.replace(/^#/, "") || "/";
  const [path, queryStr] = withoutHash.split("?");

  let page;
  if (path === "/") page = <Landing />;
  else if (path === "/login") page = <Login />;
  else if (path === "/join") page = <JoinTeam query={queryStr} />;
  else if (path === "/app") page = <ProtectedApp />;
  else page = <NotFoundPage />;

  return (
    <AuthContext.Provider value={authValue}>
      <Toaster />
      {page}
    </AuthContext.Provider>
  );
}

seedIfNeeded();
const root = createRoot(document.getElementById("root"));
root.render(<Root />);
  </script>
